name: PCL VEOSC Manual Build

on:
  workflow_dispatch: # 仅允许手动点击按钮触发构建

jobs:
  build-and-publish:
    name: Build & Pack VEOSC
    runs-on: windows-latest

    steps:
    # 1. 检出代码
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 安装 .NET 10 SDK
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. 还原 NuGet 依赖
    - name: Restore Dependencies
      run: dotnet restore PCL.Shion.slnx

    # 4. 发布 Windows 客户端 (使用 --no-warn 参数隔离分号，防止 MSBuild 解析错误)
    - name: Publish Windows Client
      run: >
        dotnet publish PCL.Shion/PCL.Shion.csproj 
        -c Release 
        -r win-x64 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:PublishTrimmed=false 
        --no-warn CS8600,CS8602,CS8603,CS8604,CS8618,CS0108 
        -o ./dist/PCL_VEOSC_Windows

    # 5. 发布 Linux 客户端
    - name: Publish Linux Client
      run: >
        dotnet publish PCL.Shion/PCL.Shion.csproj 
        -c Release 
        -r linux-x64 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:PublishTrimmed=false 
        --no-warn CS8600,CS8602,CS8603,CS8604,CS8618,CS0108 
        -o ./dist/PCL_VEOSC_Linux

    # 6. 上传 Windows 构建产物
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCL-VEOSC-Windows-Latest
        path: ./dist/PCL_VEOSC_Windows/
        retention-days: 7

    # 7. 上传 Linux 构建产物
    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCL-VEOSC-Linux-Latest
        path: ./dist/PCL_VEOSC_Linux/
        retention-days: 7
