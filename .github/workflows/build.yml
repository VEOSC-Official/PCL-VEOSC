name: PCL VEOSC Manual Build

on:
  workflow_dispatch: # 仅允许手动点击按钮触发构建

jobs:
  build-and-publish:
    name: Build & Pack VEOSC
    runs-on: windows-latest # 考虑到打包 Windows 平台和潜在组件兼容性，使用 windows 环境更稳妥

    steps:
    # 1. 检出代码
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 安装 .NET 10 SDK
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. 还原 NuGet 依赖
    - name: Restore Dependencies
      run: dotnet restore PCL.Shion.slnx

    # 4. 运行 Core 测试
    - name: Run Core Tests
      run: dotnet test PCL.Shion.Core.Test/PCL.Shion.Core.Test.csproj -c Release --no-restore

    # 5. 运行主测试
    - name: Run Main Tests
      run: dotnet test PCL.Shion.Test/PCL.Shion.Test.csproj -c Release --no-restore

    # 6. 发布 Windows 客户端 (独立单文件版，绿色美观)
    - name: Publish Windows Client
      run: >
        dotnet publish PCL.Shion/PCL.Shion.csproj 
        -c Release 
        -r win-x64 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:PublishTrimmed=false 
        -o ./dist/PCL_VEOSC_Windows

    # 7. 发布 Linux 客户端 (独立单文件版)
    - name: Publish Linux Client
      run: >
        dotnet publish PCL.Shion/PCL.Shion.csproj 
        -c Release 
        -r linux-x64 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:PublishTrimmed=false 
        -o ./dist/PCL_VEOSC_Linux

    # 8. 上传 Windows 构建产物到 Actions 页面
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCL-VEOSC-Windows-Latest
        path: ./dist/PCL_VEOSC_Windows/
        retention-days: 7 # 产物在网页上保留7天，过期自动清理，节约空间

    # 9. 上传 Linux 构建产物到 Actions 页面
    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCL-VEOSC-Linux-Latest
        path: ./dist/PCL_VEOSC_Linux/
        retention-days: 7
