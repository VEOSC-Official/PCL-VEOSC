name: PCL VEOSC Manual Build

on:
  workflow_dispatch: # 仅允许手动点击按钮触发构建

jobs:
  build-and-publish:
    name: Build & Pack VEOSC
    runs-on: windows-latest # 改用 Windows 环境，完美支持 PCL 的特定组件

    steps:
    # 1. 检出代码
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 安装 .NET 10 SDK
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. 还原 NuGet 依赖
    - name: Restore Dependencies
      run: dotnet restore PCL.Shion.slnx

    # 4. 强行发布 Windows 客户端 (忽略一切可能阻断流程的 Null 警告和测试)
    - name: Publish Windows Client
      run: >
        dotnet publish PCL.Shion/PCL.Shion.csproj 
        -c Release 
        -r win-x64 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:PublishTrimmed=false 
        -p:NoWarn="CS8600;CS8602;CS8603;CS8604;CS8618;CS0108"
        -o ./dist/PCL_VEOSC_Windows

    # 5. 强行发布 Linux 客户端
    - name: Publish Linux Client
      run: >
        dotnet publish PCL.Shion/PCL.Shion.csproj 
        -c Release 
        -r linux-x64 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:PublishTrimmed=false 
        -p:NoWarn="CS8600;CS8602;CS8603;CS8604;CS8618;CS0108"
        -o ./dist/PCL_VEOSC_Linux

    # 6. 确保将文件夹里的文件完整上传
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCL-VEOSC-Windows-Latest
        path: ./dist/PCL_VEOSC_Windows/
        retention-days: 7

    # 7. 上传 Linux 构建产物
    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCL-VEOSC-Linux-Latest
        path: ./dist/PCL_VEOSC_Linux/
        retention-days: 7
